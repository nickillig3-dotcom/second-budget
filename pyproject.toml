[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-budget"
version = "0.1.0"
description = "An independent second opinion on a household's SNAP determination, with an engine proven by replaying 42,689 federal quality-control households."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "strands-agents==1.53.0",
    "strands-agents-tools",
    "pydantic>=2",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]

[project.scripts]
sb = "second_budget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
